<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>求职工作台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Outfit:wght@400;500;600&display=swap">
<style>
/* Layout: sage canvas, white rounded cards in a bento grid; black pills for primary actions, lime for "now/active". */
:root{
  --bg:#eceff1;--surface:rgba(255,255,255,.72);--solid:#ffffff;--sunk:rgba(20,22,24,.045);--fg:#141516;--muted:#6b7177;--line:rgba(20,22,24,.08);
  --ink:#141516;--on-ink:#ffffff;--lime:#74d7c4;--on-lime:#0d2420;--sage:#dff4ef;--sage-deep:#141516;
  --accent:#141516;--accent-soft:#e1f5f0;
  --warn:#b7791f;--warn-soft:rgba(251,240,217,.85);--bad:#d65f54;--bad-soft:rgba(250,226,222,.9);--good:#2aa592;--good-soft:#dbf3ee;
  --glass-line:rgba(255,255,255,.9);--shadow:0 1px 2px rgba(20,22,24,.04),0 10px 30px -12px rgba(20,22,24,.12);
  --band:rgba(20,22,24,.06);--night:#141516;--on-night:#eef0f2;--night-2:#2a2c2f;--r-lg:24px;--r-md:16px;--r-sm:12px;
  --sans:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --num:"Outfit","Noto Sans SC",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d0e0f;--surface:rgba(30,32,34,.7);--solid:#1c1e20;--sunk:rgba(255,255,255,.05);--fg:#eef0f2;--muted:#8d9399;--line:rgba(255,255,255,.08);
  --ink:#eef0f2;--on-ink:#141516;--lime:#74d7c4;--on-lime:#0d2420;--sage:#183330;--sage-deep:#eef0f2;
  --accent:#eef0f2;--accent-soft:#163430;--glass-line:rgba(255,255,255,.06);--shadow:0 10px 30px -12px rgba(0,0,0,.6);--band:rgba(255,255,255,.06);--night:#000;--on-night:#eef0f2;--night-2:#2a2c2f;--warn:#e0a948;--warn-soft:#3a2f1a;--bad:#ef8a7c;--bad-soft:#3d2421;--good:#74d7c4;--good-soft:#163430;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0e0f;--surface:rgba(30,32,34,.7);--solid:#1c1e20;--sunk:rgba(255,255,255,.05);--fg:#eef0f2;--muted:#8d9399;--line:rgba(255,255,255,.08);
  --ink:#eef0f2;--on-ink:#141516;--lime:#74d7c4;--on-lime:#0d2420;--sage:#183330;--sage-deep:#eef0f2;
  --accent:#eef0f2;--accent-soft:#163430;--glass-line:rgba(255,255,255,.06);--shadow:0 10px 30px -12px rgba(0,0,0,.6);--band:rgba(255,255,255,.06);--night:#000;--on-night:#eef0f2;--night-2:#2a2c2f;--warn:#e0a948;--warn-soft:#3a2f1a;--bad:#ef8a7c;--bad-soft:#3d2421;--good:#74d7c4;--good-soft:#163430;color-scheme:dark}
*{box-sizing:border-box}
body{background:radial-gradient(900px 500px at 85% -10%,rgba(116,215,196,.28),transparent 60%),radial-gradient(700px 500px at -10% 30%,rgba(116,215,196,.14),transparent 60%),var(--bg);background-attachment:fixed;color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
header .wrap{padding-block:0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:transparent;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.hbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:14px}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.01em}
.tabs{display:flex;gap:6px}
.tabs button{border:0;background:var(--surface);padding:8px 16px;border-radius:999px;color:var(--fg);font:inherit;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--on-ink);font-weight:500}
.sync{margin-left:auto;font-size:12px;color:var(--muted);background:var(--surface);padding:6px 12px;border-radius:999px}
button,select,input,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 16px;border-radius:999px;cursor:pointer}
.btn:hover{border-color:var(--fg)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--on-ink);font-weight:500}
.btn.sm{padding:4px 12px;font-size:12px}
.btn.del{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-block:20px 14px}
.seg{display:inline-flex;gap:4px;background:var(--surface);padding:4px;border-radius:999px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--on-ink);font-weight:500}
.spacer{flex:1}
/* glass surfaces */
.tile,.acard,.rv,.ocard,.calbox,.empty,.modal,.tabs button,.seg,.sync,.btn{backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%)}
.tile,.acard,.rv,.ocard,.empty,.modal{border:1px solid var(--glass-line);box-shadow:var(--shadow)}
.modal{background:var(--solid)}
/* clickable */
.click,.acard,.cc,.mrow,.todo{cursor:pointer;transition:transform .15s,box-shadow .15s}
.tile.click:hover,.rv.click:hover,.ocard.click:hover,.acard:hover{transform:translateY(-2px);box-shadow:0 14px 34px -14px rgba(20,22,24,.25)}
.stalebox.click:hover{filter:brightness(.97)}
.fstage,.fdrop{cursor:pointer}
.fhit{fill:transparent;transition:fill .15s}
.fstage:hover .fhit,.fdrop:hover .fhit,.fstage:focus-visible .fhit,.fdrop:focus-visible .fhit{fill:rgba(116,215,196,.16)}
.fstage:focus,.fdrop:focus{outline:none}
.fchip{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--on-ink);border-radius:999px;padding:5px 6px 5px 14px;font-size:13px}
.fchip button{border:0;background:rgba(255,255,255,.18);color:inherit;width:22px;height:22px;border-radius:999px;cursor:pointer;font-size:11px}
.linkish{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-decoration:underline;text-decoration-color:var(--lime);text-underline-offset:3px}
#appsList{scroll-margin-top:80px}
/* overview: left = KPIs + funnel ring, right = calendar */
.ov{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:12px;margin-top:12px;align-items:stretch}
.ovl{display:flex}.ovl>.tile{flex:1}
.ovr{display:flex;min-width:0}.ovr>.tile{flex:1}
@media (max-width:960px){.ov{grid-template-columns:1fr}}
.ovl{display:flex;flex-direction:column;gap:12px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:6px}
.ftile{margin-top:12px}
.fscroll{overflow-x:auto;margin:0 -6px}
.fsvg{display:block;width:100%;min-width:640px;height:auto}
.fhint{font-size:12px;color:var(--muted)}
@media (max-width:640px){.fhint{display:none}}
.tile{background:var(--surface);border-radius:var(--r-lg);padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tile.lime{background:linear-gradient(135deg,#8fe3d3,var(--lime));color:var(--on-lime);border-color:rgba(255,255,255,.5)}
.tile.sage{background:#141516;color:#fff;border-color:rgba(255,255,255,.08)}
.tile.sage .icon{background:var(--lime);color:var(--on-lime)}
.lbl{font-size:12px;opacity:.75;letter-spacing:.02em}
.big{font-family:var(--num);font-size:38px;line-height:1;font-weight:500;font-variant-numeric:tabular-nums}
.big small{font-size:14px;opacity:.7;margin-left:4px}
@media (max-width:420px){.kpis .tile{padding:14px}.big{font-size:30px}.kpis .row .lbl{display:block;width:100%}}
.icon{width:32px;height:32px;border-radius:999px;background:var(--surface);color:var(--fg);display:grid;place-items:center;flex:none}
.icon.soft{background:var(--accent-soft);color:var(--good)}
.icon svg{width:16px;height:16px}
.funnel{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.fring{width:230px;height:230px;max-width:100%;flex:none;color:var(--fg)}
.flegend{display:flex;flex-direction:column;gap:7px;flex:1;min-width:180px}
.fl{display:grid;grid-template-columns:10px minmax(0,1fr) 28px 44px;gap:8px;align-items:center;font-size:13px}
.fl i{width:10px;height:10px;border-radius:999px}
.fl b{font-family:var(--num);font-weight:500;text-align:right}
.fl .cv{color:var(--muted);font-family:var(--num);font-size:12px;text-align:right}
/* alerts */
.alert{display:flex;gap:10px;align-items:center;background:var(--warn-soft);color:var(--warn);border-radius:var(--r-md);padding:10px 14px;font-size:13px;margin-top:12px}
.alert.badc{background:var(--bad-soft);color:var(--bad)}
/* application cards (list view) */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.acard{background:var(--surface);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0;cursor:pointer;transition:transform .15s}
.acard:hover{transform:translateY(-2px)}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nextline{display:flex;gap:8px;align-items:center;font-size:13px;min-width:0}
.nextline .one{flex:1;min-width:0}
.nl-ic{width:24px;height:24px;border-radius:999px;background:var(--sunk);display:grid;place-items:center;flex:none}
.nl-ic svg{width:13px;height:13px}
.nl-t{font-family:var(--num);font-size:12px;color:var(--muted);white-space:nowrap}
.afoot{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
.btn.ghost{border-color:transparent;background:var(--sunk)}
.acard.stale{box-shadow:inset 0 0 0 2px var(--warn)}
.ahead{display:flex;gap:10px;align-items:center}
.avatar{width:38px;height:38px;border-radius:999px;background:var(--sunk);display:grid;place-items:center;font-weight:700;flex:none}
.co{font-weight:700}
.sub{color:var(--muted);font-size:12px}
.prog{display:flex;gap:3px}
.prog i{flex:1;height:6px;border-radius:999px;background:var(--sunk)}
.prog i.on{background:var(--ink)}
.prog.bad i.on{background:var(--bad)}
.prog.offer i.on{background:var(--good)}
.nextbox{background:var(--sunk);border-radius:var(--r-sm);padding:8px 10px;font-size:13px;display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.stage{background:var(--accent-soft);color:var(--fg)}
.chip.stale{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.ex{background:transparent;border:1px dashed var(--line)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
/* kanban */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--sunk);border-radius:var(--r-lg);padding:10px;min-height:200px;display:flex;flex-direction:column;gap:10px}
.col.over{outline:2px dashed var(--fg)}
.col h3{font-size:13px;margin:4px 6px 0;display:flex;justify-content:space-between;align-items:center;font-weight:500}
.col h3 span:last-child{background:var(--surface);border-radius:999px;padding:0 8px;font-family:var(--num)}
.card{background:var(--surface);border-radius:var(--r-md);padding:12px;cursor:grab;display:flex;flex-direction:column;gap:8px}
.card.stale{box-shadow:inset 0 0 0 2px var(--warn)}
.card .next{font-size:12px}
.card{cursor:pointer}
.nextbtn{width:30px;height:30px;flex:none;border-radius:999px;border:0;background:var(--ink);color:var(--on-ink);font-size:14px;cursor:pointer;display:grid;place-items:center}
.nextbtn:hover{background:var(--lime);color:var(--on-lime)}
/* calendar card */
.cal-head{display:flex;align-items:center;gap:6px}
.cal-head b{white-space:nowrap}
@media (max-width:420px){.cal-head .chip{display:none}}
.cal-head b{font-size:16px;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:11px;color:var(--muted);text-align:center;padding:2px 0}
.cc{border:0;background:none;color:inherit;border-radius:var(--r-sm);min-height:70px;padding:5px;display:flex;flex-direction:column;align-items:stretch;gap:3px;text-align:left;cursor:pointer;min-width:0;font:inherit}
.cc:hover{background:var(--sunk)}
.cc.out{opacity:.35}
.cc .d{font-family:var(--num);font-size:12px;width:22px;height:22px;display:grid;place-items:center;border-radius:999px}
.cc.today .d{background:var(--ink);color:var(--on-ink)}
.cc.has{background:rgba(116,215,196,.16)}
.cc.has.clash{background:var(--bad-soft)}
.cc.sel{box-shadow:inset 0 0 0 2px var(--lime)}
.evc{display:block;font-size:10.5px;line-height:1.3;padding:3px 6px;border-radius:7px;background:var(--ink);color:var(--on-ink);min-width:0}
.evc .txt{display:flex;flex-direction:column}
.evc .txt>*{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evc b{font-weight:600;font-family:var(--num)}
.evc.test{background:var(--lime);color:var(--on-lime)}
.evc.clash{background:var(--bad);color:#fff}
.cc.past .evc{opacity:.55}
.more{font-size:10px;color:var(--muted);padding-left:4px}
@media (max-width:560px){.cc{min-height:48px;padding:3px;align-items:center}.evc{width:100%;height:5px;padding:0}.evc .txt{display:none}.cal{gap:2px}}
.calleg{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.calleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.lg-int{background:var(--ink)}.lg-test{background:var(--lime)}.lg-clash{background:var(--bad)}
.todo{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);cursor:pointer;font-size:13px;min-width:0}
.row+.todo{border-top:0}
.avatar.sm{width:28px;height:28px;font-size:12px}
.stalebox{margin-top:auto;display:flex;gap:8px;align-items:center;background:var(--warn-soft);color:var(--warn);border-radius:var(--r-sm);padding:8px 10px;font-size:13px;min-width:0}
.stalebox .nl-ic{background:transparent}
.mrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.tile>.row+.mrow{border-top:0}
.mrow .t{font-family:var(--num);font-size:22px;font-weight:500;line-height:1}
.mrow .t small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:4px}
.mrow.clash .t{color:var(--bad)}
.mono{font-family:var(--num);font-variant-numeric:tabular-nums}
/* reviews */
.rv{background:var(--surface);border-radius:var(--r-lg);padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.rv-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.modal .rv-list{grid-template-columns:1fr}
@media (max-width:420px){.rv-list{grid-template-columns:1fr}}
.q{background:var(--sunk);border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.q .qlbl{font-size:12px;color:var(--muted)}
.q .weak{color:var(--bad)}
.improve{background:var(--lime);color:var(--on-lime);border-radius:var(--r-sm);padding:10px 12px;font-size:13px}
.qmix{display:flex;height:8px;border-radius:999px;overflow:hidden;gap:2px}
/* offers */
.ocards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ocard{background:var(--surface);border-radius:var(--r-lg);padding:18px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.ocard.best{background:linear-gradient(150deg,#9be6d8,var(--lime));color:var(--on-lime)}
.ocard.best .sub,.ocard.best .lbl{color:var(--on-lime)}
.ocard .ring{width:64px;height:64px;flex:none}
.meter{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;align-items:center;font-size:12px}
.meter .pips{display:flex;gap:4px}
.meter .pips i{flex:1;height:8px;border-radius:999px;background:var(--sunk)}
.ocard.best .meter .pips i{background:rgba(0,0,0,.1)}
.meter .pips i.on{background:var(--ink)}
.ocard.best .meter .pips i.on{background:#16181a}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kv div{background:var(--sunk);border-radius:var(--r-sm);padding:8px 10px;min-width:0}
.ocard.best .kv div{background:rgba(255,255,255,.45)}
.kv b{display:block;font-family:var(--num);font-size:17px;font-weight:500}
.note{font-size:12px;color:var(--muted);margin-top:10px}
/* modal */
.mask{position:fixed;inset:0;background:rgba(20,24,22,.4);z-index:20;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:var(--r-lg);width:min(640px,100%);padding:22px;display:flex;flex-direction:column;gap:14px}
.modal h2{margin:0;font-size:18px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{border:1px solid transparent;background:var(--sunk);border-radius:var(--r-sm);padding:9px 12px;font-size:14px;color:var(--fg);width:100%}
label.f input:focus,label.f select:focus,label.f textarea:focus{border-color:var(--fg);outline:none}
textarea{min-height:64px;resize:vertical}
.full{grid-column:1/-1}
.sublist{display:flex;flex-direction:column;gap:8px}
.subitem{background:var(--sunk);border-radius:var(--r-md);padding:12px;display:flex;flex-direction:column;gap:8px}
.subitem label.f input,.subitem label.f textarea{background:var(--surface)}
.empty{color:var(--muted);text-align:center;padding:44px 16px;background:var(--surface);border-radius:var(--r-lg);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty svg{width:44px;height:44px;opacity:.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--on-ink);padding:10px 16px;border-radius:999px;z-index:30;font-size:13px}
.login{max-width:400px;margin:48px auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header><div class="wrap"><div class="hbar">
  <h1>求职工作台</h1>
  <nav class="tabs" id="tabs">
    <button data-t="apps" class="on">投递追踪</button>
    <button data-t="reviews">面试复盘</button>
    <button data-t="offers">Offer 对比</button>
  </nav>
  <span class="sync" id="sync">连接中…</span><button class="btn sm" id="logoutBtn" onclick="logout()" hidden>退出</button>
</div></div></header>

<main class="wrap" id="main"></main>
<div id="modalRoot"></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const STAGES=["待投递","已投递","简历评估","笔试","一面","二面","HR 面","Offer","未通过","不考虑"];
const FUNNEL=["已投递","简历评估","笔试","一面","二面","HR 面","Offer"];
const FITS=["✅ 够得上","⚠️ 可以冲","❌ 先放放"];

function donut(parts,size,center,sub){ // parts:[{v,c}]
  const r=40,C=2*Math.PI*r,tot=parts.reduce((s,p)=>s+p.v,0)||1;let off=0;
  const segs=parts.filter(p=>p.v>0).map(p=>{const len=p.v/tot*C;const g=parts.filter(x=>x.v>0).length>1?2:0;const s=`<circle cx="50" cy="50" r="${r}" fill="none" stroke="${p.c}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${Math.max(len-g,0.01)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 50 50)"/>`;off+=len;return s}).join("");
  return `<svg viewBox="0 0 100 100" style="width:${size}px;height:${size}px" role="img"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--sunk)" stroke-width="9"/>${segs}<text x="50" y="${sub?50:56}" text-anchor="middle" font-family="Outfit,sans-serif" font-size="22" font-weight="500" fill="currentColor">${center}</text>${sub?`<text x="50" y="66" text-anchor="middle" font-size="10" fill="currentColor" opacity=".6">${sub}</text>`:""}</svg>`;
}

function funnelSVG(steps,n){
  const W=1000,H=262,cy=130,N=steps.length,x0=80,x1=W-80,R=58,rmin=24;
  const xs=steps.map((_,i)=>x0+i*(x1-x0)/(N-1));
  const rs=steps.map(([,v])=>n?Math.max(rmin,R*Math.sqrt(v/n)):rmin);
  let band="",rings="",txt="";
  for(let i=0;i<N-1;i++)band+=`<polygon points="${xs[i]},${cy-rs[i]*.72} ${xs[i+1]},${cy-rs[i+1]*.72} ${xs[i+1]},${cy+rs[i+1]*.72} ${xs[i]},${cy+rs[i]*.72}" fill="var(--band)"/>`;
  steps.forEach(([st,v],i)=>{const r=rs[i],sw=Math.max(7,r*.3),rr=r-sw/2,C=2*Math.PI*rr,f=n?v/n:0;const colW=(x1-x0)/(N-1);
    rings+=`<g class="fstage" role="button" tabindex="0" aria-label="查看到达${st}的投递" onclick="filterApps('reach','${st}')" onkeydown="if(event.key==='Enter')filterApps('reach','${st}')"><rect x="${xs[i]-colW/2}" y="0" width="${colW}" height="${cy+R+4}" rx="18" class="fhit"/>`;
    rings+=`<circle cx="${xs[i]}" cy="${cy}" r="${r}" fill="var(--solid)"/><circle cx="${xs[i]}" cy="${cy}" r="${rr}" fill="none" stroke="var(--sunk)" stroke-width="${sw}"/>`;
    if(f>0)rings+=`<circle cx="${xs[i]}" cy="${cy}" r="${rr}" fill="none" stroke="${i===N-1?"var(--lime)":"var(--ink)"}" stroke-width="${sw}" stroke-dasharray="${f>=1?C:f*C} ${C}" transform="rotate(-90 ${xs[i]} ${cy})"/>`;
    const pct=n?(v/n*100):0;
    rings+=`<text x="${xs[i]}" y="${cy+4}" text-anchor="middle" font-size="${r>40?17:13}" font-family="Outfit,sans-serif" font-weight="500" fill="var(--fg)">${pct>=99.95?"100":pct.toFixed(pct<10&&pct>0?1:0)}%</text>`;
    rings+=`<text x="${xs[i]}" y="${cy-R-44}" text-anchor="middle" font-size="15" fill="var(--muted)">${st}</text><text x="${xs[i]}" y="${cy-R-14}" text-anchor="middle" font-size="26" font-family="Outfit,sans-serif" font-weight="500" fill="var(--fg)">${v}</text></g>`;
    if(i){const prev=steps[i-1][1],drop=prev-v,sc=prev?Math.round(v/prev*100):0;
      txt+=`<g class="fdrop" role="button" tabindex="0" aria-label="查看停在${steps[i-1][0]}、没进入${st}的投递" onclick="filterApps('drop','${st}')" onkeydown="if(event.key==='Enter')filterApps('drop','${st}')"><rect x="${xs[i]-36}" y="${cy+R+10}" width="72" height="50" rx="12" class="fhit"/><text x="${xs[i]}" y="${cy+R+30}" text-anchor="middle" font-size="15" font-family="Outfit,sans-serif" font-weight="600" fill="var(--bad)">▼${drop}</text><text x="${xs[i]}" y="${cy+R+52}" text-anchor="middle" font-size="13" font-family="Outfit,sans-serif" fill="var(--muted)">↪ ${prev?sc+"%":"–"}</text></g>`;}
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="fsvg" aria-label="招聘阶段漏斗，点击某个阶段查看对应投递">${band}${rings}${txt}</svg>`;
}

function calCard(){
  if(!S.calMonth){const d=new Date();S.calMonth=[d.getFullYear(),d.getMonth()]}
  const[y,m]=S.calMonth;const first=new Date(y,m,1);const start=new Date(y,m,1-((first.getDay()+6)%7));
  const ev=allEvents();const tStr=todayStr();const now=new Date();let cells="";
  const dstr=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const ds=dstr(d);
    const day=ev.filter(e=>e.at.slice(0,10)===ds).sort((a,b)=>a.start-b.start);
    const cls=[d.getMonth()!==m?"out":"",ds===tStr?"today":"",day.length?(day.some(e=>e.clash)?"has clash":"has"):"",ds<tStr?"past":"",S.calSel===ds?"sel":""].join(" ");
    cells+=`<button class="cc ${cls}" onclick="S.calSel=S.calSel==='${ds}'?null:'${ds}';render()" aria-label="${ds}，${day.length} 场"><span class="d">${d.getDate()}</span>${day.slice(0,2).map(e=>`<span class="evc ${e.clash?"clash":e.type==="笔试"?"test":""}" title="${esc(e.at.slice(11,16)+" "+e.app.company+" "+e.type)}"><span class="txt"><b>${e.at.slice(11,16)} ${esc(e.type)}</b><span>${esc(e.app.company.replace(/（.*?）/,""))}</span></span></span>`).join("")}${day.length>2?`<span class="more">+${day.length-2}</span>`:""}</button>`;
    if(i===34&&new Date(start.getTime()+35*864e5).getMonth()!==m)break;}
  const clashN=ev.filter(e=>e.end>=now&&e.clash).length;
  return `<div class="tile calcard"><div class="cal-head"><b>${y} 年 ${m+1} 月</b>${clashN?`<span class="chip bad">${clashN} 场时间冲突</span>`:""}<span class="spacer"></span><button class="btn sm" onclick="calShift(-1)" aria-label="上个月">←</button><button class="btn sm" onclick="S.calMonth=null;S.calSel=null;render()">本月</button><button class="btn sm" onclick="calShift(1)" aria-label="下个月">→</button></div>

</div>`;
}

/* ---------- offers ---------- */
const CUR={SGD:"S$",CNY:"¥",USD:"$"};
function offerCalc(o){
  const base=(+o.monthly||0)*(+o.months||0);
  const fund=o.currency==="CNY"?(+o.monthly||0)*((+o.fundPct||0)/100)*12*2:(+o.monthly||0)*((+o.fundPct||0)/100)*12;
  const total=base+(+o.extraCash||0);
  const score=Math.round(((+o.growth||0)*0.4+(6-(+o.intensity||3))*0.3+(+o.fit||0)*0.3)*20);
  return{base,fund,total,score};
}
const money=(v,c)=>(CUR[c]||"")+Math.round(v).toLocaleString();
function renderOffers(){
  const rows=S.offers.map(o=>({o,c:offerCalc(o)}));
  const best=rows.length>1?rows.reduce((a,b)=>b.c.score>a.c.score?b:a).o.id:null;
  const pips=(v,lbl)=>`<div class="meter"><span>${lbl}</span><div class="pips">${[1,2,3,4,5].map(k=>`<i class="${k<=v?"on":""}"></i>`).join("")}</div></div>`;
  return `<div class="toolbar"><b style="font-size:16px">Offer 对比</b><span class="spacer"></span><button class="btn pri" onclick="editOffer()">＋ 新增 Offer</button></div>
  ${rows.length?`<div class="ocards">${rows.sort((a,b)=>b.c.score-a.c.score).map(({o,c})=>`<article class="ocard click ${o.id===best?"best":""}" role="button" tabindex="0" onclick="if(!event.target.closest('button'))editOffer('${o.id}')">
    <div class="ahead"><div style="flex:1;min-width:0"><div class="co" style="font-size:16px">${esc(o.company)}</div><div class="sub">${esc(o.role)} · ${esc(o.city)}</div>${o.id===best?'<span class="chip" style="background:var(--ink);color:var(--on-ink);margin-top:6px">综合分最高</span>':""}</div>
      <div style="color:inherit">${donut([{v:c.score,c:o.id===best?"#0d2420":"var(--ink)"},{v:100-c.score,c:"transparent"}],64,c.score)}</div></div>
    <div><div class="lbl">年包（现金）</div><div class="big" style="font-size:32px">${money(c.total,o.currency)}</div><div class="sub">${money(o.monthly,o.currency)} × ${esc(o.months)} 个月${+o.extraCash?` + 其他 ${money(o.extraCash,o.currency)}`:""}</div></div>
    <div class="kv"><div><span class="lbl">${o.currency==="CNY"?"公积金":"公积金 / CPF"}</span><b>${esc(o.fundPct)}%</b><span class="sub">约 ${money(c.fund,o.currency)}/年</span></div><div><span class="lbl">月薪</span><b>${money(o.monthly,o.currency)}</b><span class="sub">${esc(o.currency)}</span></div></div>
    <div style="display:flex;flex-direction:column;gap:6px">${pips(+o.growth||0,"成长空间")}${pips(+o.intensity||0,"工作强度")}${pips(+o.fit||0,"匹配度")}</div>
    ${o.perks?`<div class="sub">${esc(o.perks)}</div>`:""}
    <div class="acts"><button class="btn sm" onclick="editOffer('${o.id}')">编辑</button></div></article>`).join("")}</div>
  <p class="note">年包 = 月薪 × 月数 + 签字费/其他现金。公积金按人民币口径计个人+公司两份，新加坡 CPF 只计公司部分。综合分（满分 100）= 成长空间 40% + 工作强度（越低越好）30% + 匹配度 30%。不同币种的年包不直接比较。</p>`
  :emptyBox("还没有 Offer。拿到后点「新增 Offer」记录。")}`;
}
window.editOffer=id=>{const o=id?structuredClone(S.offers.find(x=>x.id===id)):{id:newId("of"),company:"",role:"",city:"",currency:"CNY",monthly:"",months:13,fundPct:12,extraCash:0,intensity:3,growth:3,fit:3,perks:""};
  draft=o;
  openModal(`<h2>${id?"编辑 Offer":"新增 Offer"}</h2><div class="grid2">
  <label class="f">公司<input id="o_company" value="${esc(o.company)}"></label><label class="f">岗位<input id="o_role" value="${esc(o.role)}"></label>
  <label class="f">城市<input id="o_city" value="${esc(o.city)}"></label><label class="f">币种<select id="o_currency">${opt(["SGD","CNY","USD","其他"],o.currency)}</select></label>
  <label class="f">月薪<input type="number" id="o_monthly" value="${esc(o.monthly)}"></label><label class="f">月数<input type="number" step="0.5" id="o_months" value="${esc(o.months)}"></label>
  <label class="f">公积金 / CPF 比例 %<input type="number" step="0.5" id="o_fundPct" value="${esc(o.fundPct)}"></label><label class="f">签字费 / 其他现金（年）<input type="number" id="o_extraCash" value="${esc(o.extraCash)}"></label>
  <label class="f">工作强度 1–5（5 最累）<input type="number" min="1" max="5" id="o_intensity" value="${esc(o.intensity)}"></label><label class="f">成长空间 1–5<input type="number" min="1" max="5" id="o_growth" value="${esc(o.growth)}"></label>
  <label class="f">个人匹配度 1–5<input type="number" min="1" max="5" id="o_fit" value="${esc(o.fit)}"></label>
  <label class="f full">其他福利<textarea id="o_perks">${esc(o.perks)}</textarea></label></div>
  <div class="row">${id?`<button class="btn del" onclick="confirmDel('offers','${o.id}',this)">删除</button>`:""}<span class="spacer"></span><button class="btn" onclick="closeModal()">取消</button><button class="btn pri" onclick="commitOffer()">保存</button></div>`)};
window.commitOffer=()=>{const o=draft;["company","role","city","currency","monthly","months","fundPct","extraCash","intensity","growth","fit","perks"].forEach(k=>o[k]=$("#o_"+k).value.trim());
  ["intensity","growth","fit"].forEach(k=>o[k]=Math.min(5,Math.max(1,+o[k]||3)));if(!o.company){toast("请填写公司");return}delete o.example;save("offers",o);closeModal()};
</script>

</body>
</html>
